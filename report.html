<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VES Report</title>
<style>
  *{box-sizing:border-box;}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#EEEADC;color:#1a1a1a;margin:0;padding:16px;}
  .bar{max-width:820px;margin:0 auto 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .bar a,.bar button{background:#102A3D;color:#fff;border:none;border-radius:5px;padding:9px 14px;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;}
  .bar a.secondary{background:transparent;color:#102A3D;border:1px solid #B9B196;}
  .bar .hint{font-size:12px;color:#50575C;}
  #msg{max-width:820px;margin:0 auto 12px;font-size:14px;}
  #msg.err{background:#F6E4E1;color:#AE3B2E;border-radius:6px;padding:12px;}
  .report-page{max-width:820px;margin:0 auto;background:#fff;border:1px solid #D6D0BE;border-radius:6px;padding:22px 20px;}
  .report-page h1{font-size:18px;margin:2px 0 0;color:#0F2438;}
  .rl-header{display:flex;align-items:center;gap:10px;border-bottom:2px solid #0F2438;padding-bottom:10px;margin-bottom:12px;}
  .rl-header img{width:46px;height:46px;object-fit:contain;}
  .rl-org{font-size:11px;color:#4B5257;text-transform:uppercase;letter-spacing:.03em;}
  .report-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:12.5px;margin-bottom:10px;}
  .report-info-grid div span{color:#666;font-size:10.5px;display:block;}
  table.rtbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
  table.rtbl th,table.rtbl td{border:1px solid #bbb;padding:4px 6px;text-align:left;}
  table.rtbl th{background:#f0efe8;font-size:10.5px;text-transform:uppercase;}
  .report-attachments{margin-top:14px;}
  .report-attachments .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .report-attachments img{width:100%;border:1px solid #ccc;border-radius:3px;display:block;}
  .report-attachments .cap{font-size:10.5px;color:#555;margin-top:2px;text-align:center;}
  .sig-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px;font-size:12px;}
  .sig-line{border-top:1px solid #333;margin-top:34px;padding-top:4px;}
  svg{width:100%;height:auto;display:block;}
  @media print{
    body{background:#fff;padding:0;}
    .bar,#msg{display:none !important;}
    .report-page{border:none;padding:0;max-width:none;}
  }
</style>
</head>
<body>
<div class="bar">
  <button id="printBtn" type="button">🖨️ Print / Save as PDF</button>
  <a class="secondary" href="./">← Back to all surveys</a>
  <span class="hint">Tip: in the print window choose "Save as PDF".</span>
</div>
<div id="msg">Loading report…</div>
<div class="report-page" id="reportPage" style="display:none;"></div>
 
<script>
(function(){
  "use strict";
  function $(id){ return document.getElementById(id); }
  function escapeHtml(str){
    return String(str == null ? "" : str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function infoCell(label, val){
    return '<div><span>'+escapeHtml(label)+'</span>'+escapeHtml(val || "—")+'</div>';
  }
  function readJson(key){
    try{ return JSON.parse(localStorage.getItem(key)) || null; }catch(e){ return null; }
  }
  function fail(text){
    $("msg").className = "err";
    $("msg").textContent = text;
  }
 
  // --- chart code: identical to the app's, so the report looks the same ---
  function buildChartSVG(readings, opts){
    opts = opts || {};
    var W = 640, H = 460;
    var mL = 60, mR = 18, mT = 18, mB = 44;
    var plotW = W - mL - mR, plotH = H - mT - mB;
 
    var isDark = (document.documentElement.getAttribute("data-theme") === "dark");
    var col = {
      grid: isDark ? "#2C3742" : "#D6D0BE",
      gridMajor: isDark ? "#44515C" : "#B9B196",
      axis: isDark ? "#B7BEC3" : "#50575C",
      line: isDark ? "#E3A34D" : "#C67B2E",
      point: isDark ? "#12191E" : "#F6F4EE",
      pointStroke: isDark ? "#E3A34D" : "#A9631E",
      text: isDark ? "#EDEBE3" : "#1B1E1F"
    };
 
    if (readings.length < 2){
      return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="none"/>' +
        '<text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" font-family="sans-serif" font-size="14" fill="'+col.text+'">' +
        'Enter at least 2 valid readings (AB/2 &amp; ρa &gt; 0) to draw the curve</text></svg>';
    }
 
    var xs = readings.map(function(r){return r.ab2;});
    var ys = readings.map(function(r){return r.rho;});
    var xMinE = Math.floor(Math.log10(Math.min.apply(null, xs)));
    var xMaxE = Math.ceil(Math.log10(Math.max.apply(null, xs)));
    if (xMinE === xMaxE) xMaxE = xMinE + 1;
    var yMinE = Math.floor(Math.log10(Math.min.apply(null, ys)));
    var yMaxE = Math.ceil(Math.log10(Math.max.apply(null, ys)));
    if (yMinE === yMaxE) yMaxE = yMinE + 1;
 
    function xPix(v){ return mL + (Math.log10(v) - xMinE) / (xMaxE - xMinE) * plotW; }
    function yPix(v){ return mT + plotH - (Math.log10(v) - yMinE) / (yMaxE - yMinE) * plotH; }
 
    function decadeLabel(e){
      var v = Math.pow(10, e);
      if (v >= 1) return v.toLocaleString();
      return v.toString();
    }
 
    var svg = [];
    svg.push('<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" font-family="'+ '-apple-system,Segoe UI,Roboto,Arial,sans-serif' +'">');
    svg.push('<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="none"/>');
 
    // minor + major gridlines, X
    for (var e = xMinE; e <= xMaxE; e++){
      var xMaj = xPix(Math.pow(10,e));
      svg.push('<line x1="'+xMaj+'" y1="'+mT+'" x2="'+xMaj+'" y2="'+(mT+plotH)+'" stroke="'+col.gridMajor+'" stroke-width="1"/>');
      svg.push('<text x="'+xMaj+'" y="'+(mT+plotH+16)+'" text-anchor="middle" font-size="10.5" fill="'+col.axis+'">'+decadeLabel(e)+'</text>');
      if (e < xMaxE){
        for (var m=2; m<=9; m++){
          var v = m * Math.pow(10,e);
          var xp = xPix(v);
          if (xp <= mL+plotW) svg.push('<line x1="'+xp+'" y1="'+mT+'" x2="'+xp+'" y2="'+(mT+plotH)+'" stroke="'+col.grid+'" stroke-width="0.6"/>');
        }
      }
    }
    // minor + major gridlines, Y
    for (var ey = yMinE; ey <= yMaxE; ey++){
      var yMaj = yPix(Math.pow(10,ey));
      svg.push('<line x1="'+mL+'" y1="'+yMaj+'" x2="'+(mL+plotW)+'" y2="'+yMaj+'" stroke="'+col.gridMajor+'" stroke-width="1"/>');
      svg.push('<text x="'+(mL-6)+'" y="'+(yMaj+3.5)+'" text-anchor="end" font-size="10.5" fill="'+col.axis+'">'+decadeLabel(ey)+'</text>');
      if (ey < yMaxE){
        for (var my=2; my<=9; my++){
          var vy = my * Math.pow(10,ey);
          var yp = yPix(vy);
          if (yp >= mT) svg.push('<line x1="'+mL+'" y1="'+yp+'" x2="'+(mL+plotW)+'" y2="'+yp+'" stroke="'+col.grid+'" stroke-width="0.6"/>');
        }
      }
    }
 
    // axes border
    svg.push('<rect x="'+mL+'" y="'+mT+'" width="'+plotW+'" height="'+plotH+'" fill="none" stroke="'+col.axis+'" stroke-width="1.1"/>');
 
    // axis titles
    svg.push('<text x="'+(mL+plotW/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="11.5" fill="'+col.text+'" font-weight="600">AB/2 (m)</text>');
    svg.push('<text x="14" y="'+(mT+plotH/2)+'" text-anchor="middle" font-size="11.5" fill="'+col.text+'" font-weight="600" transform="rotate(-90 14 '+(mT+plotH/2)+')">Apparent resistivity ρa (Ω·m)</text>');
 
    // polyline
    var pts = readings.map(function(r){ return xPix(r.ab2) + "," + yPix(r.rho); }).join(" ");
    svg.push('<polyline points="'+pts+'" fill="none" stroke="'+col.line+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>');
 
    // points
    readings.forEach(function(r){
      svg.push('<circle cx="'+xPix(r.ab2)+'" cy="'+yPix(r.rho)+'" r="4" fill="'+col.point+'" stroke="'+col.pointStroke+'" stroke-width="2"/>');
    });
 
    svg.push('</svg>');
    return svg.join("");
  }
 
  function validReadings(list){
    return (list || [])
      .map(function(r){ return {ab2: parseFloat(r.ab2), rho: parseFloat(r.rho)}; })
      .filter(function(r){ return !isNaN(r.ab2) && !isNaN(r.rho) && r.ab2>0 && r.rho>0; })
      .sort(function(a,b){ return a.ab2 - b.ab2; });
  }
 
  function render(s){
    // office name / logo are saved in this browser by the app (same web address)
    var p = readJson("ves_profile_v1") || {};
    var readings = (s.readings || []).filter(function(r){ return r.ab2!=="" || r.rho!==""; });
    var rows = readings.map(function(r,i){
      return "<tr><td>"+(i+1)+"</td><td>"+escapeHtml(r.ab2)+"</td><td>"+escapeHtml(r.mn2||"—")+"</td><td>"+escapeHtml(r.rho)+"</td></tr>";
    }).join("");
 
    var atts = (s.attachments || []).filter(function(a){ return a.includeInReport; });
    var imgs = atts.filter(function(a){ return a.kind === "image" && a.dataUrl; });
    var others = atts.filter(function(a){ return a.kind !== "image"; });
    var attHtml = "";
    if (imgs.length || others.length){
      attHtml += '<div class="report-attachments"><h3 style="font-size:12.5px;margin:0 0 4px;">Attachments</h3>';
      if (imgs.length){
        attHtml += '<div class="rgrid">';
        imgs.forEach(function(a){ attHtml += '<div><img src="'+a.dataUrl+'"><div class="cap">'+escapeHtml(a.name)+'</div></div>'; });
        attHtml += '</div>';
      }
      if (others.length){
        attHtml += '<ul style="font-size:11.5px;margin:8px 0 0;padding-left:18px;">' +
          others.map(function(a){ return '<li>'+escapeHtml(a.name)+' (attached file, not shown inline)</li>'; }).join("") + '</ul>';
      }
      attHtml += '</div>';
    }
 
    var org = p.org || "National Water Supply & Drainage Board — Sri Lanka";
    var html =
      '<div class="rl-header">' +
        (p.logo ? '<img src="'+p.logo+'">' : '') +
        '<div><div class="rl-org">'+escapeHtml(org)+'</div>' +
        '<h1>Vertical Electrical Sounding — Field Report</h1>' +
        '<div style="font-size:11px;color:#666;">Chart / VES ID: '+escapeHtml(s.chartId||"—")+'</div></div>' +
      '</div>' +
      '<div class="report-info-grid">' +
        infoCell("Site / location", s.siteName) +
        infoCell("Client", s.clientName) +
        infoCell("VES / station no.", s.vesNo) +
        infoCell("Chart / VES ID", s.chartId) +
        infoCell("Date", s.date) +
        infoCell("Electrode array", s.array) +
        infoCell("Coordinates", (s.lat && s.lng) ? (s.lat+", "+s.lng) : "—") +
        infoCell("Recorded by", s.operator) +
        infoCell("Office", p.office) +
        infoCell("Contact", p.contact) +
      '</div>' +
      (s.remarks ? '<p style="font-size:12.5px;"><strong>Field remarks:</strong> '+escapeHtml(s.remarks)+'</p>' : '') +
      '<div style="margin:12px 0;">' + buildChartSVG(validReadings(s.readings)) + '</div>' +
      '<table class="rtbl"><thead><tr><th>#</th><th>AB/2 (m)</th><th>MN/2 (m)</th><th>ρa (Ω·m)</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<p style="font-size:11px;color:#666;margin-top:8px;">Curve and table as recorded in the field. Interpretation of subsurface layering is to be carried out separately by a qualified hydrogeologist.</p>' +
      attHtml +
      '<div class="sig-row">' +
        '<div><div class="sig-line">Recorded by (name, date)</div></div>' +
        '<div><div class="sig-line">Checked by (name, date)</div></div>' +
      '</div>';
    $("reportPage").innerHTML = html;
    $("reportPage").style.display = "block";
    $("msg").style.display = "none";
    document.title = "VES Report — " + (s.chartId || s.siteName || "survey");
  }
 
  var id = new URLSearchParams(location.search).get("id");
  if (!id){ fail("No survey chosen. Go back and click Report next to a survey."); return; }
 
  // the API key: the one saved on the admin page, or the one saved in the app
  var conn = readJson("ves_admin_connection_v1") || {};
  var sync = readJson("ves_sync_settings_v1") || {};
  var apiKey = conn.apiKey || sync.apiKey || "";
  if (!apiKey){ fail("No API key saved in this browser. Open the dashboard (Back to all surveys), enter the API key, press Connect, then click Report again."); return; }
 
  fetch(location.origin + "/api/surveys/" + encodeURIComponent(id), { headers: { "x-api-key": apiKey } })
    .then(function(res){
      if (res.status === 404) throw new Error("This survey was not found in the database (it may have been deleted).");
      if (res.status === 401) throw new Error("The API key was rejected. Open the dashboard, enter the correct API key, press Connect, then try again.");
      if (!res.ok) throw new Error("The server answered with an error (" + res.status + ").");
      return res.json();
    })
    .then(render)
    .catch(function(err){
      fail(err && err.message ? err.message : "Could not load the report.");
    });
 
  $("printBtn").addEventListener("click", function(){ window.print(); });
})();
</script>
</body>
</html>
