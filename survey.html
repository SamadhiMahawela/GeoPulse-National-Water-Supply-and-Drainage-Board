<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VES Survey Record</title>
<style>
  :root{ --navy:#102A3D; --line:#D6D0BE; --paper:#F6F4EE; --ink:#1B1E1F; --good:#2F6E4E; --goodbg:#E4EFE8; }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);margin:0;}
  header{background:var(--navy);color:#fff;padding:14px 20px;}
  header h1{margin:0;font-size:18px;}
  header p{margin:3px 0 0;font-size:12px;color:#B9C6CE;}
  main{max-width:900px;margin:0 auto;padding:16px;}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .bar a{background:var(--navy);color:#fff;border-radius:5px;padding:9px 14px;font-size:13.5px;font-weight:600;text-decoration:none;}
  .bar a.secondary{background:transparent;color:var(--navy);border:1px solid #B9B196;}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px;}
  .card h2{font-size:14px;margin:0 0 10px;color:#155459;}
  #msg{font-size:14px;margin-bottom:12px;}
  #msg.err{background:#F6E4E1;color:#AE3B2E;border-radius:6px;padding:12px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:13.5px;}
  .grid div span{display:block;color:#666;font-size:11px;}
  table.rt{width:100%;border-collapse:collapse;font-size:13px;}
  table.rt th,table.rt td{border:1px solid #ccc;padding:5px 8px;text-align:left;}
  table.rt th{background:#f0efe8;font-size:11px;text-transform:uppercase;}
  svg.chart{width:100%;height:auto;display:block;}
  .atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
  .att{border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff;}
  .att img{width:100%;height:150px;object-fit:cover;border-radius:4px;display:block;background:#eee;}
  .att .ico{height:150px;display:flex;align-items:center;justify-content:center;font-size:42px;background:#f0efe8;border-radius:4px;}
  .att .nm{font-size:12.5px;font-weight:600;margin-top:6px;word-break:break-all;}
  .att .mt{font-size:11px;color:#666;margin:2px 0 6px;}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 8px;}
  .badge.yes{background:var(--goodbg);color:var(--good);}
  .badge.no{background:#EEEADC;color:#50575C;}
  .att a.dl{display:inline-block;margin-top:6px;font-size:12.5px;}
  .empty{color:#7B8287;font-size:13px;}
</style>
</head>
<body>
<header>
  <h1 id="title">Survey record</h1>
  <p>Everything saved in the database for this survey.</p>
</header>
<main>
  <div class="bar">
    <a class="secondary" href="./">← All surveys</a>
    <a id="reportLink" href="#" target="_blank" rel="noopener">📄 Open printable report</a>
  </div>
  <div id="msg">Loading…</div>
  <div id="content" style="display:none;">
    <div class="card"><h2>Survey details</h2><div class="grid" id="info"></div></div>
    <div class="card"><h2>Sounding curve (log–log)</h2><div id="chartHost"></div></div>
    <div class="card"><h2>Readings</h2><div id="readingsHost"></div></div>
    <div class="card"><h2>Photos &amp; files <span id="attCount" style="font-weight:400;color:#666;"></span></h2><div id="attHost"></div></div>
  </div>
</main>
 
<script>
(function(){
  "use strict";
  function $(id){ return document.getElementById(id); }
  function esc(str){
    return String(str == null ? "" : str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function readJson(key){ try{ return JSON.parse(localStorage.getItem(key)) || null; }catch(e){ return null; } }
  function fail(t){ $("msg").className = "err"; $("msg").textContent = t; }
  function fmtBytes(n){
    n = Number(n)||0;
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n/1024).toFixed(0) + " KB";
    return (n/1048576).toFixed(1) + " MB";
  }
  function cell(label, val){ return '<div><span>'+esc(label)+'</span>'+esc(val || "—")+'</div>'; }
 
  // --- chart code: identical to the app's, so the report looks the same ---
  function buildChartSVG(readings, opts){
    opts = opts || {};
    var W = 640, H = 460;
    var mL = 60, mR = 18, mT = 18, mB = 44;
    var plotW = W - mL - mR, plotH = H - mT - mB;
 
    var isDark = (document.documentElement.getAttribute("data-theme") === "dark");
    var col = {
      grid: isDark ? "#2C3742" : "#D6D0BE",
      gridMajor: isDark ? "#44515C" : "#B9B196",
      axis: isDark ? "#B7BEC3" : "#50575C",
      line: isDark ? "#E3A34D" : "#C67B2E",
      point: isDark ? "#12191E" : "#F6F4EE",
      pointStroke: isDark ? "#E3A34D" : "#A9631E",
      text: isDark ? "#EDEBE3" : "#1B1E1F"
    };
 
    if (readings.length < 2){
      return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="none"/>' +
        '<text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" font-family="sans-serif" font-size="14" fill="'+col.text+'">' +
        'Enter at least 2 valid readings (AB/2 &amp; ρa &gt; 0) to draw the curve</text></svg>';
    }
 
    var xs = readings.map(function(r){return r.ab2;});
    var ys = readings.map(function(r){return r.rho;});
    var xMinE = Math.floor(Math.log10(Math.min.apply(null, xs)));
    var xMaxE = Math.ceil(Math.log10(Math.max.apply(null, xs)));
    if (xMinE === xMaxE) xMaxE = xMinE + 1;
    var yMinE = Math.floor(Math.log10(Math.min.apply(null, ys)));
    var yMaxE = Math.ceil(Math.log10(Math.max.apply(null, ys)));
    if (yMinE === yMaxE) yMaxE = yMinE + 1;
 
    function xPix(v){ return mL + (Math.log10(v) - xMinE) / (xMaxE - xMinE) * plotW; }
    function yPix(v){ return mT + plotH - (Math.log10(v) - yMinE) / (yMaxE - yMinE) * plotH; }
 
    function decadeLabel(e){
      var v = Math.pow(10, e);
      if (v >= 1) return v.toLocaleString();
      return v.toString();
    }
 
    var svg = [];
    svg.push('<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" font-family="'+ '-apple-system,Segoe UI,Roboto,Arial,sans-serif' +'">');
    svg.push('<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="none"/>');
 
    // minor + major gridlines, X
    for (var e = xMinE; e <= xMaxE; e++){
      var xMaj = xPix(Math.pow(10,e));
      svg.push('<line x1="'+xMaj+'" y1="'+mT+'" x2="'+xMaj+'" y2="'+(mT+plotH)+'" stroke="'+col.gridMajor+'" stroke-width="1"/>');
      svg.push('<text x="'+xMaj+'" y="'+(mT+plotH+16)+'" text-anchor="middle" font-size="10.5" fill="'+col.axis+'">'+decadeLabel(e)+'</text>');
      if (e < xMaxE){
        for (var m=2; m<=9; m++){
          var v = m * Math.pow(10,e);
          var xp = xPix(v);
          if (xp <= mL+plotW) svg.push('<line x1="'+xp+'" y1="'+mT+'" x2="'+xp+'" y2="'+(mT+plotH)+'" stroke="'+col.grid+'" stroke-width="0.6"/>');
        }
      }
    }
    // minor + major gridlines, Y
    for (var ey = yMinE; ey <= yMaxE; ey++){
      var yMaj = yPix(Math.pow(10,ey));
      svg.push('<line x1="'+mL+'" y1="'+yMaj+'" x2="'+(mL+plotW)+'" y2="'+yMaj+'" stroke="'+col.gridMajor+'" stroke-width="1"/>');
      svg.push('<text x="'+(mL-6)+'" y="'+(yMaj+3.5)+'" text-anchor="end" font-size="10.5" fill="'+col.axis+'">'+decadeLabel(ey)+'</text>');
      if (ey < yMaxE){
        for (var my=2; my<=9; my++){
          var vy = my * Math.pow(10,ey);
          var yp = yPix(vy);
          if (yp >= mT) svg.push('<line x1="'+mL+'" y1="'+yp+'" x2="'+(mL+plotW)+'" y2="'+yp+'" stroke="'+col.grid+'" stroke-width="0.6"/>');
        }
      }
    }
 
    // axes border
    svg.push('<rect x="'+mL+'" y="'+mT+'" width="'+plotW+'" height="'+plotH+'" fill="none" stroke="'+col.axis+'" stroke-width="1.1"/>');
 
    // axis titles
    svg.push('<text x="'+(mL+plotW/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="11.5" fill="'+col.text+'" font-weight="600">AB/2 (m)</text>');
    svg.push('<text x="14" y="'+(mT+plotH/2)+'" text-anchor="middle" font-size="11.5" fill="'+col.text+'" font-weight="600" transform="rotate(-90 14 '+(mT+plotH/2)+')">Apparent resistivity ρa (Ω·m)</text>');
 
    // polyline
    var pts = readings.map(function(r){ return xPix(r.ab2) + "," + yPix(r.rho); }).join(" ");
    svg.push('<polyline points="'+pts+'" fill="none" stroke="'+col.line+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>');
 
    // points
    readings.forEach(function(r){
      svg.push('<circle cx="'+xPix(r.ab2)+'" cy="'+yPix(r.rho)+'" r="4" fill="'+col.point+'" stroke="'+col.pointStroke+'" stroke-width="2"/>');
    });
 
    svg.push('</svg>');
    return svg.join("");
  }
 
  function validReadings(list){
    return (list || [])
      .map(function(r){ return {ab2: parseFloat(r.ab2), rho: parseFloat(r.rho)}; })
      .filter(function(r){ return !isNaN(r.ab2) && !isNaN(r.rho) && r.ab2>0 && r.rho>0; })
      .sort(function(a,b){ return a.ab2 - b.ab2; });
  }
 
  function iconFor(a){
    var m = (a.mime||"").toLowerCase(), n = (a.name||"").toLowerCase();
    if (m.indexOf("pdf")>=0) return "📄";
    if (m.indexOf("word")>=0 || /\.docx?$/.test(n)) return "📝";
    if (m.indexOf("sheet")>=0 || /\.xlsx?$/.test(n)) return "📊";
    return "📎";
  }
 
  function render(s){
    var title = (s.siteName || "Untitled site") + (s.chartId ? "  ·  " + s.chartId : "");
    $("title").textContent = title;
    document.title = "VES record — " + (s.chartId || s.siteName || "survey");
 
    var maps = (s.lat && s.lng)
      ? ' <a href="https://www.google.com/maps?q='+encodeURIComponent(s.lat+","+s.lng)+'" target="_blank" rel="noopener">open map</a>' : "";
    $("info").innerHTML =
      cell("Site / location", s.siteName) + cell("Client", s.clientName) +
      cell("Chart / VES ID", s.chartId) + cell("VES / station no.", s.vesNo) +
      cell("Date", s.date) + cell("Electrode array", s.array) +
      '<div><span>Coordinates</span>'+esc((s.lat && s.lng) ? (s.lat+", "+s.lng) : "—")+maps+'</div>' +
      cell("Recorded by", s.operator) +
      cell("First saved", s.createdAt ? new Date(s.createdAt).toLocaleString() : "") +
      cell("Last updated", s.updatedAt ? new Date(s.updatedAt).toLocaleString() : "") +
      '<div style="grid-column:1/-1;"><span>Field remarks</span>'+esc(s.remarks || "—")+'</div>';
 
    $("chartHost").innerHTML = buildChartSVG(validReadings(s.readings)).replace("<svg ", '<svg class="chart" ');
 
    var rows = (s.readings || []).filter(function(r){ return r.ab2!=="" || r.rho!==""; });
    $("readingsHost").innerHTML = rows.length
      ? '<table class="rt"><thead><tr><th>#</th><th>AB/2 (m)</th><th>MN/2 (m)</th><th>ρa (Ω·m)</th></tr></thead><tbody>' +
        rows.map(function(r,i){ return '<tr><td>'+(i+1)+'</td><td>'+esc(r.ab2)+'</td><td>'+esc(r.mn2||"—")+'</td><td>'+esc(r.rho)+'</td></tr>'; }).join("") +
        '</tbody></table>'
      : '<div class="empty">No readings saved.</div>';
 
    var atts = s.attachments || [];
    var inRep = atts.filter(function(a){ return a.includeInReport; }).length;
    $("attCount").textContent = atts.length ? "— " + atts.length + " file(s), " + inRep + " in the report" : "";
    $("attHost").innerHTML = atts.length ? '<div class="atts">' + atts.map(function(a){
      var thumb = (a.kind === "image" && a.dataUrl)
        ? '<img src="'+a.dataUrl+'" alt="'+esc(a.name)+'">'
        : '<div class="ico">'+iconFor(a)+'</div>';
      return '<div class="att">' + thumb +
        '<div class="nm">'+esc(a.name)+'</div>' +
        '<div class="mt">'+fmtBytes(a.size)+'</div>' +
        '<span class="badge '+(a.includeInReport?"yes":"no")+'">'+(a.includeInReport?"In the report":"Saved only")+'</span><br>' +
        (a.dataUrl ? '<a class="dl" href="'+a.dataUrl+'" download="'+esc(a.name)+'">⬇ Download</a>' : '') +
      '</div>';
    }).join("") + '</div>' : '<div class="empty">No photos or files were attached to this survey.</div>';
 
    $("content").style.display = "block";
    $("msg").style.display = "none";
  }
 
  var id = new URLSearchParams(location.search).get("id");
  if (!id){ fail("No survey chosen. Go back to the list and click Full record next to a survey."); return; }
  $("reportLink").href = "report.html?id=" + encodeURIComponent(id);
 
  var conn = readJson("ves_admin_connection_v1") || {};
  var sync = readJson("ves_sync_settings_v1") || {};
  var apiKey = conn.apiKey || sync.apiKey || "";
  if (!apiKey){ fail("No API key saved in this browser. Go back to the list, enter the API key, press Connect, then open the record again."); return; }
 
  fetch(location.origin + "/api/surveys/" + encodeURIComponent(id), { headers: { "x-api-key": apiKey } })
    .then(function(res){
      if (res.status === 404) throw new Error("This survey was not found in the database (it may have been deleted).");
      if (res.status === 401) throw new Error("The API key was rejected. Go back to the list, enter the correct key, press Connect, then try again.");
      if (!res.ok) throw new Error("The server answered with an error (" + res.status + ").");
      return res.json();
    })
    .then(render)
    .catch(function(err){ fail(err && err.message ? err.message : "Could not load this survey."); });
})();
</script>
</body>
</html>
