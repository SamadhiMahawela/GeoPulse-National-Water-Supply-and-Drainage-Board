<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VES Server — Admin</title>
<style>
  :root{ --navy:#102A3D; --teal:#1C6E76; --ochre:#C67B2E; --paper:#F6F4EE; --line:#D6D0BE; --ink:#1B1E1F; }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);margin:0;}
  header{background:var(--navy);color:#fff;padding:16px 20px;}
  header h1{margin:0;font-size:18px;}
  header p{margin:4px 0 0;font-size:12px;color:#B9C6CE;}
  main{max-width:1100px;margin:0 auto;padding:20px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px;}
  label{display:block;font-size:12px;font-weight:600;color:#50575C;margin-bottom:4px;}
  input{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;font-size:14px;margin-bottom:10px;}
  button{background:var(--navy);color:#fff;border:none;border-radius:4px;padding:8px 14px;font-size:13px;cursor:pointer;margin-right:8px;}
  button.secondary{background:transparent;color:var(--navy);border:1px solid var(--line);}
  button.danger{background:#AE3B2E;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
  th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top;}
  th{font-size:10.5px;text-transform:uppercase;color:#7B8287;}
  #status{font-size:13px;margin-top:8px;}
  #status.err{color:#AE3B2E;}
  #status.ok{color:#2F6E4E;}
  .pill{display:inline-block;background:#EEEADC;border-radius:20px;padding:1px 8px;font-size:11px;}
  .empty{padding:30px;text-align:center;color:#7B8287;}
  .btn-download{display:inline-block;padding:4px 8px;background:#1C6E76;color:#fff;border:none;border-radius:4px;font-size:11px;cursor:pointer;}
  .btn-download:hover{background:#102A3D;}
</style>
</head>
<body>
<header>
  <h1>VES Server — Admin</h1>
  <p>Read-only overview of every survey saved by any device connected to this server.</p>
</header>
<main>
  <div class="card">
    <label for="baseUrl">Server URL</label>
    <input id="baseUrl" placeholder="https://your-ves-server.onrender.com">
    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" placeholder="Server's API key">
    <button id="connectBtn">Connect</button>
    <button class="secondary" id="refreshBtn">Refresh</button>
    <button class="secondary" id="exportBtn">Export all as CSV</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <div id="tableHost"><div class="empty">Connect to a server above to see surveys.</div></div>
  </div>
</main>

<script>
(function(){
  "use strict";
  var LS_KEY = "ves_admin_connection_v1";

  var baseUrlEl = document.getElementById("baseUrl");
  var apiKeyEl = document.getElementById("apiKey");
  var statusEl = document.getElementById("status");
  var tableHost = document.getElementById("tableHost");
  var lastRows = [];

  function loadSaved(){
    try{
      var s = JSON.parse(localStorage.getItem(LS_KEY));
      if (s){ baseUrlEl.value = s.baseUrl || ""; apiKeyEl.value = s.apiKey || ""; }
    }catch(e){}
  }
  function persist(){
    localStorage.setItem(LS_KEY, JSON.stringify({baseUrl: baseUrlEl.value.trim(), apiKey: apiKeyEl.value.trim()}));
  }

  function setStatus(msg, cls){
    statusEl.textContent = msg;
    statusEl.className = cls || "";
  }

  function fetchSurveys(){
    var base = baseUrlEl.value.trim().replace(/\/+$/,"");
    var key = apiKeyEl.value.trim();
    if (!base){ setStatus("Enter a server URL.", "err"); return; }
    setStatus("Loading…");
    fetch(base + "/api/surveys", { headers: { "x-api-key": key } })
      .then(function(res){
        if (!res.ok) throw new Error("Server responded " + res.status + " (check the API key)");
        return res.json();
      })
      .then(function(rows){
        lastRows = rows;
        renderTable(rows);
        setStatus("Loaded " + rows.length + " survey(s) — " + new Date().toLocaleTimeString(), "ok");
      })
      .catch(function(err){ setStatus("Error: " + err.message, "err"); });
  }

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function renderTable(rows){
    if (!rows.length){ tableHost.innerHTML = '<div class="empty">No surveys on this server yet.</div>'; return; }
    var html = '<table><thead><tr>' +
      '<th>Chart ID</th><th>Site</th><th>Client</th><th>VES No.</th><th>Date</th><th>Array</th><th>Readings</th><th>Files</th><th>Recorded by</th><th>Device</th><th>Updated</th><th>Download Report</th>' +
      '</tr></thead><tbody>';
    rows.forEach(function(r, index){
      html += '<tr>' +
        '<td style="font-family:monospace;font-size:11px;">'+esc(r.chartId||"—")+'</td>' +
        '<td>'+esc(r.siteName||"—")+'</td>' +
        '<td>'+esc(r.clientName||"—")+'</td>' +
        '<td>'+esc(r.vesNo||"—")+'</td>' +
        '<td>'+esc(r.date||"—")+'</td>' +
        '<td><span class="pill">'+esc(r.array||"—")+'</span></td>' +
        '<td>'+ (r.readings ? r.readings.length : 0) +'</td>' +
        '<td>'+ (r.attachments ? r.attachments.length : 0) +'</td>' +
        '<td>'+esc(r.operator||"—")+'</td>' +
        '<td style="font-family:monospace;font-size:11px;">'+esc((r.deviceId||"").slice(0,10))+'</td>' +
        '<td>'+ (r.updatedAt ? new Date(r.updatedAt).toLocaleString() : "—") +'</td>' +
        '<td><button class="btn-download" data-index="' + index + '">📥 Download Report</button></td>' +
      '</tr>';
    });
    html += '</tbody></table>';
    tableHost.innerHTML = html;

    var btns = tableHost.querySelectorAll('.btn-download');
    btns.forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.getAttribute('data-index'), 10);
        if (lastRows[idx]) downloadStandaloneReport(lastRows[idx]);
      });
    });
  }

  function resolveImageUrl(rawSrc, serverBase) {
    if (!rawSrc) return '';
    if (rawSrc.startsWith('data:') || rawSrc.startsWith('http://') || rawSrc.startsWith('https://')) {
      return rawSrc;
    }
    var cleanBase = serverBase.replace(/\/+$/, "");
    var path = rawSrc.startsWith('/') ? rawSrc : '/' + rawSrc;
    return cleanBase + path;
  }

  function downloadStandaloneReport(s) {
    var serverBase = baseUrlEl.value.trim().replace(/\/+$/,"");

    // 1. Build Reading Rows
    var readings = s.readings || [];
    var readingsRows = readings.map(function(rd, idx) {
      return '<tr>' +
        '<td>' + (idx + 1) + '</td>' +
        '<td>' + esc(rd.ab2 || rd.ab_2 || '—') + '</td>' +
        '<td>' + esc(rd.mn2 || rd.mn_2 || '—') + '</td>' +
        '<td>' + esc(rd.pa || rd.rho || '—') + '</td>' +
      '</tr>';
    }).join('');

    // 2. Build Offline SVG Log-Log Plot Chart
    var chartSvg = '<p style="color:#7B8287;font-size:12px;">No valid reading points available for plotting.</p>';
    var validPts = readings.filter(function(r) {
      var x = parseFloat(r.ab2 || r.ab_2);
      var y = parseFloat(r.pa || r.rho);
      return !isNaN(x) && x > 0 && !isNaN(y) && y > 0;
    });

    if (validPts.length > 0) {
      var svgW = 600, svgH = 300, padL = 60, padR = 20, padT = 20, padB = 40;
      var plotW = svgW - padL - padR;
      var plotH = svgH - padT - padB;

      var xVals = validPts.map(function(p){ return Math.log10(parseFloat(p.ab2 || p.ab_2)); });
      var yVals = validPts.map(function(p){ return Math.log10(parseFloat(p.pa || p.rho)); });

      var minX = Math.floor(Math.min.apply(null, xVals));
      var maxX = Math.ceil(Math.max.apply(null, xVals));
      if (minX === maxX) { minX -= 1; maxX += 1; }

      var minY = Math.floor(Math.min.apply(null, yVals));
      var maxY = Math.ceil(Math.max.apply(null, yVals));
      if (minY === maxY) { minY -= 1; maxY += 1; }

      function getX(val) {
        return padL + ((Math.log10(val) - minX) / (maxX - minX)) * plotW;
      }
      function getY(val) {
        return padT + plotH - ((Math.log10(val) - minY) / (maxY - minY)) * plotH;
      }

      var gridSvg = '';
      for (var xPow = minX; xPow <= maxX; xPow++) {
        var xPx = padL + ((xPow - minX) / (maxX - minX)) * plotW;
        var labelX = Math.pow(10, xPow);
        gridSvg += `<line x1="${xPx}" y1="${padT}" x2="${xPx}" y2="${padT + plotH}" stroke="#E0E0E0" stroke-width="1"/>`;
        gridSvg += `<text x="${xPx}" y="${padT + plotH + 18}" font-size="10" fill="#666" text-anchor="middle">${labelX}</text>`;
      }

      for (var yPow = minY; yPow <= maxY; yPow++) {
        var yPx = padT + plotH - ((yPow - minY) / (maxY - minY)) * plotH;
        var labelY = Math.pow(10, yPow);
        gridSvg += `<line x1="${padL}" y1="${yPx}" x2="${padL + plotW}" y2="${yPx}" stroke="#E0E0E0" stroke-width="1"/>`;
        gridSvg += `<text x="${padL - 8}" y="${yPx + 4}" font-size="10" fill="#666" text-anchor="end">${labelY}</text>`;
      }

      var polyPoints = [];
      var circlesSvg = '';
      validPts.forEach(function(pt) {
        var xVal = parseFloat(pt.ab2 || pt.ab_2);
        var yVal = parseFloat(pt.pa || pt.rho);
        var cx = getX(xVal);
        var cy = getY(yVal);
        polyPoints.push(cx + ',' + cy);
        circlesSvg += `<circle cx="${cx}" cy="${cy}" r="4" fill="#C67B2E" stroke="#102A3D" stroke-width="1.5"/>`;
      });

      chartSvg = `<svg width="100%" height="100%" viewBox="0 0 ${svgW} ${svgH}" style="background:#fff; border:1px solid #D6D0BE; border-radius:4px;">
        ${gridSvg}
        <rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="none" stroke="#B0B0B0" stroke-width="1"/>
        <polyline points="${polyPoints.join(' ')}" fill="none" stroke="#C67B2E" stroke-width="2"/>
        ${circlesSvg}
        <text x="${padL + plotW / 2}" y="${svgH - 5}" font-size="11" fill="#102A3D" text-anchor="middle" font-weight="bold">AB/2 (m)</text>
        <text x="15" y="${padT + plotH / 2}" font-size="11" fill="#102A3D" text-anchor="middle" font-weight="bold" transform="rotate(-90 15 ${padT + plotH / 2})">Apparent resistivity ρa (Ω·m)</text>
      </svg>`;
    }

    // 3. Resolve Attachments with Server Fallback Base
    var attachmentsHtml = '<p style="font-size:12px;color:#7B8287;">No attachments.</p>';
    if (s.attachments && s.attachments.length > 0) {
      attachmentsHtml = '<div style="display:flex; flex-wrap:wrap; gap:12px;">' +
        s.attachments.map(function(att) {
          var name = att.name || (typeof att === 'string' ? att : 'Attachment');
          var rawPath = att.data || att.url || att.path || att.filename || (typeof att === 'string' ? att : '');
          
          if (!rawPath.startsWith('data:') && !rawPath.startsWith('http')) {
            if (!rawPath.includes('/')) {
              rawPath = '/uploads/' + rawPath;
            }
          }
          
          var finalUrl = resolveImageUrl(rawPath, serverBase);

          return '<div style="text-align:center; border:1px solid #D6D0BE; padding:8px; border-radius:4px; background:#fafafa; max-width:200px;">' +
                   '<a href="' + esc(finalUrl) + '" target="_blank" rel="noopener noreferrer" style="text-decoration:none;">' +
                     '<img src="' + esc(finalUrl) + '" alt="' + esc(name) + '" onerror="this.onerror=null; this.src=\'' + esc(serverBase + '/uploads/' + name) + '\';" style="max-width:180px; max-height:180px; object-fit:contain; display:block; margin:0 auto 6px; border:1px solid #E0E0E0; background:#fff;"/>' +
                   '</a>' +
                   '<span style="font-size:11px; color:#50575C; word-break:break-all;">' + esc(name) + '</span>' +
                 '</div>';
        }).join('') +
      '</div>';
    }

    // 4. Assemble Offline Report Document
    var htmlContent = `<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VES Field Report — ${esc(s.siteName || 'Site')}</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 30px; color: #1B1E1F; background: #fff; line-height: 1.4; }
  .print-btn { background: #102A3D; color: #fff; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 20px; font-weight: 600; }
  .header { border-bottom: 2px solid #102A3D; padding-bottom: 8px; margin-bottom: 16px; }
  .header h1 { margin: 0; color: #102A3D; font-size: 18px; text-transform: uppercase; letter-spacing: 0.5px; }
  .header h2 { margin: 4px 0 0; color: #102A3D; font-size: 15px; font-weight: bold; }
  .sub-id { font-size: 11px; color: #7B8287; margin-top: 2px; }
  
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 16px; font-size: 13px; }
  .meta-row { display: flex; margin-bottom: 4px; }
  .meta-label { width: 110px; color: #50575C; font-weight: 500; }
  .meta-val { font-weight: 600; color: #102A3D; }

  .section-title { font-size: 13px; font-weight: bold; color: #102A3D; margin: 16px 0 8px; }
  .remarks-box { font-size: 13px; background: #F6F4EE; padding: 8px 12px; border-radius: 4px; border: 1px solid #D6D0BE; margin-bottom: 16px; }

  .chart-container { width: 100%; max-width: 650px; margin-bottom: 20px; }

  table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 12px; }
  th, td { border: 1px solid #D6D0BE; padding: 6px 10px; text-align: left; }
  th { background: #F6F4EE; color: #102A3D; font-weight: bold; font-size: 11px; text-transform: uppercase; }
  
  .note-text { font-size: 11px; color: #7B8287; font-style: italic; margin-bottom: 20px; }
  
  .signatures { display: flex; justify-content: space-between; margin-top: 40px; padding-top: 20px; }
  .sig-line { width: 45%; border-top: 1px solid #102A3D; font-size: 11px; color: #50575C; padding-top: 4px; }

  @media print { .print-btn { display: none !important; } body { margin: 0; } }
</style>
</head>
<body>
  <button class="print-btn" onclick="window.print()">🖨️ Print / Save as PDF</button>

  <div class="header">
    <h1>NATIONAL WATER SUPPLY & DRAINAGE BOARD — SRI LANKA</h1>
    <h2>Vertical Electrical Sounding — Field Report</h2>
    <div class="sub-id">Chart / VES ID: ${esc(s.chartId || s.vesNo || 'N/A')}</div>
  </div>

  <div class="meta-grid">
    <div>
      <div class="meta-row"><span class="meta-label">Site / location</span><span class="meta-val">${esc(s.siteName || '—')}</span></div>
      <div class="meta-row"><span class="meta-label">VES / station no.</span><span class="meta-val">${esc(s.vesNo || '—')}</span></div>
      <div class="meta-row"><span class="meta-label">Date</span><span class="meta-val">${esc(s.date || '—')}</span></div>
      <div class="meta-row"><span class="meta-label">Coordinates</span><span class="meta-val">${esc(s.lat || '—')}, ${esc(s.lng || '—')}</span></div>
      <div class="meta-row"><span class="meta-label">Office</span><span class="meta-val">—</span></div>
    </div>
    <div>
      <div class="meta-row"><span class="meta-label">Client</span><span class="meta-val">${esc(s.clientName || '—')}</span></div>
      <div class="meta-row"><span class="meta-label">Chart / VES ID</span><span class="meta-val">${esc(s.chartId || '—')}</span></div>
      <div class="meta-row"><span class="meta-label">Electrode array</span><span class="meta-val">${esc(s.array || 'Schlumberger')}</span></div>
      <div class="meta-row"><span class="meta-label">Recorded by</span><span class="meta-val">${esc(s.operator || '—')}</span></div>
      <div class="meta-row"><span class="meta-label">Contact</span><span class="meta-val">—</span></div>
    </div>
  </div>

  <div class="section-title">Field remarks:</div>
  <div class="remarks-box">${esc(s.remarks || 'good')}</div>

  <div class="chart-container">
    ${chartSvg}
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>AB/2 (m)</th>
        <th>MN/2 (m)</th>
        <th>PA (Ω·m)</th>
      </tr>
    </thead>
    <tbody>
      ${readingsRows || '<tr><td colspan="4">No measurement readings recorded.</td></tr>'}
    </tbody>
  </table>

  <p class="note-text">Curve and table as recorded in the field. Interpretation of subsurface layering is to be carried out separately by a qualified hydrogeologist.</p>

  <div class="section-title">Attachments</div>
  ${attachmentsHtml}

  <div class="signatures">
    <div class="sig-line">Recorded by (name, date)</div>
    <div class="sig-line">Checked by (name, date)</div>
  </div>
</body>
</html>`;

    var blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
    var filename = "VES_Report_" + (s.siteName || "Survey").replace(/[^a-z0-9]/gi, '_') + "_" + (s.vesNo || "1") + ".html";
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function() { document.body.removeChild(a); }, 300);
  }

  function exportCsv(){
    if (!lastRows.length){ setStatus("Nothing loaded to export yet — click Refresh first.", "err"); return; }
    var lines = ["Chart ID,Site,Client,VES No,Date,Array,Readings Count,Recorded By,Device,Updated"];
    lastRows.forEach(function(r){
      lines.push([
        r.chartId, r.siteName, r.clientName, r.vesNo, r.date, r.array, (r.readings||[]).length, r.operator, r.deviceId,
        r.updatedAt ? new Date(r.updatedAt).toISOString() : ""
      ].map(function(v){ return '"' + String(v==null?"":v).replace(/"/g,'""') + '"'; }).join(","));
    });
    var blob = new Blob([lines.join("\n")], {type:"text/csv"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ves_all_surveys_" + new Date().toISOString().slice(0,10) + ".csv";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); }, 300);
  }

  document.getElementById("connectBtn").addEventListener("click", function(){ persist(); fetchSurveys(); });
  document.getElementById("refreshBtn").addEventListener("click", function(){ persist(); fetchSurveys(); });
  document.getElementById("exportBtn").addEventListener("click", exportCsv);

  loadSaved();
  if (baseUrlEl.value) fetchSurveys();
})();
</script>
</body>
</html>
