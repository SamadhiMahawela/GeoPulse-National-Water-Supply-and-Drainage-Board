<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VES Server — Admin</title>
<style>
  :root{ --navy:#102A3D; --teal:#1C6E76; --ochre:#C67B2E; --paper:#F6F4EE; --line:#D6D0BE; --ink:#1B1E1F; }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);margin:0;}
  header{background:var(--navy);color:#fff;padding:16px 20px;}
  header h1{margin:0;font-size:18px;}
  header p{margin:4px 0 0;font-size:12px;color:#B9C6CE;}
  main{max-width:1100px;margin:0 auto;padding:20px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px;}
  label{display:block;font-size:12px;font-weight:600;color:#50575C;margin-bottom:4px;}
  input{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;font-size:14px;margin-bottom:10px;}
  button{background:var(--navy);color:#fff;border:none;border-radius:4px;padding:8px 14px;font-size:13px;cursor:pointer;margin-right:8px;}
  button.secondary{background:transparent;color:var(--navy);border:1px solid var(--line);}
  button.danger{background:#AE3B2E;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
  th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top;}
  th{font-size:10.5px;text-transform:uppercase;color:#7B8287;}
  #status{font-size:13px;margin-top:8px;}
  #status.err{color:#AE3B2E;}
  #status.ok{color:#2F6E4E;}
  .pill{display:inline-block;background:#EEEADC;border-radius:20px;padding:1px 8px;font-size:11px;}
  .empty{padding:30px;text-align:center;color:#7B8287;}
  .btn-download{display:inline-block;padding:4px 8px;background:#1C6E76;color:#fff;border:none;border-radius:4px;font-size:11px;cursor:pointer;}
  .btn-download:hover{background:#102A3D;}
</style>
</head>
<body>
<header>
  <h1>VES Server — Admin</h1>
  <p>Read-only overview of every survey saved by any device connected to this server.</p>
</header>
<main>
  <div class="card">
    <label for="baseUrl">Server URL</label>
    <input id="baseUrl" placeholder="https://your-ves-server.onrender.com">
    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" placeholder="Server's API key">
    <button id="connectBtn">Connect</button>
    <button class="secondary" id="refreshBtn">Refresh</button>
    <button class="secondary" id="exportBtn">Export all as CSV</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <div id="tableHost"><div class="empty">Connect to a server above to see surveys.</div></div>
  </div>
</main>

<script>
(function(){
  "use strict";
  var LS_KEY = "ves_admin_connection_v1";

  var baseUrlEl = document.getElementById("baseUrl");
  var apiKeyEl = document.getElementById("apiKey");
  var statusEl = document.getElementById("status");
  var tableHost = document.getElementById("tableHost");
  var lastRows = [];

  function loadSaved(){
    try{
      var s = JSON.parse(localStorage.getItem(LS_KEY));
      if (s){ baseUrlEl.value = s.baseUrl || ""; apiKeyEl.value = s.apiKey || ""; }
    }catch(e){}
  }
  function persist(){
    localStorage.setItem(LS_KEY, JSON.stringify({baseUrl: baseUrlEl.value.trim(), apiKey: apiKeyEl.value.trim()}));
  }

  function setStatus(msg, cls){
    statusEl.textContent = msg;
    statusEl.className = cls || "";
  }

  function fetchSurveys(){
    var base = baseUrlEl.value.trim().replace(/\/+$/,"");
    var key = apiKeyEl.value.trim();
    if (!base){ setStatus("Enter a server URL.", "err"); return; }
    setStatus("Loading…");
    fetch(base + "/api/surveys", { headers: { "x-api-key": key } })
      .then(function(res){
        if (!res.ok) throw new Error("Server responded " + res.status + " (check the API key)");
        return res.json();
      })
      .then(function(rows){
        lastRows = rows;
        renderTable(rows);
        setStatus("Loaded " + rows.length + " survey(s) — " + new Date().toLocaleTimeString(), "ok");
      })
      .catch(function(err){ setStatus("Error: " + err.message, "err"); });
  }

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function renderTable(rows){
    if (!rows.length){ tableHost.innerHTML = '<div class="empty">No surveys on this server yet.</div>'; return; }
    var html = '<table><thead><tr>' +
      '<th>Chart ID</th><th>Site</th><th>Client</th><th>VES No.</th><th>Date</th><th>Array</th><th>Readings</th><th>Files</th><th>Recorded by</th><th>Device</th><th>Updated</th><th>Download Report</th>' +
      '</tr></thead><tbody>';
    rows.forEach(function(r, index){
      html += '<tr>' +
        '<td style="font-family:monospace;font-size:11px;">'+esc(r.chartId||"—")+'</td>' +
        '<td>'+esc(r.siteName||"—")+'</td>' +
        '<td>'+esc(r.clientName||"—")+'</td>' +
        '<td>'+esc(r.vesNo||"—")+'</td>' +
        '<td>'+esc(r.date||"—")+'</td>' +
        '<td><span class="pill">'+esc(r.array||"—")+'</span></td>' +
        '<td>'+ (r.readings ? r.readings.length : 0) +'</td>' +
        '<td>'+ (r.attachments ? r.attachments.length : 0) +'</td>' +
        '<td>'+esc(r.operator||"—")+'</td>' +
        '<td style="font-family:monospace;font-size:11px;">'+esc((r.deviceId||"").slice(0,10))+'</td>' +
        '<td>'+ (r.updatedAt ? new Date(r.updatedAt).toLocaleString() : "—") +'</td>' +
        '<td><button class="btn-download" data-index="' + index + '">📥 Download HTML Report</button></td>' +
      '</tr>';
    });
    html += '</tbody></table>';
    tableHost.innerHTML = html;

    // Attach click listeners to all download buttons
    var btns = tableHost.querySelectorAll('.btn-download');
    btns.forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.getAttribute('data-index'), 10);
        if (lastRows[idx]) downloadStandaloneReport(lastRows[idx]);
      });
    });
  }

  function downloadStandaloneReport(s){
    var readingsRows = (s.readings || []).map(function(rd){
      return '<tr>' +
        '<td>' + esc(rd.ab2 || rd.ab_2 || '') + '</td>' +
        '<td>' + esc(rd.mn2 || rd.mn_2 || '') + '</td>' +
        '<td>' + esc(rd.k || '') + '</td>' +
        '<td>' + esc(rd.r || rd.resistance || '') + '</td>' +
        '<td>' + esc(rd.pa || rd.rho || '') + '</td>' +
      '</tr>';
    }).join('');

    var htmlContent = `<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VES Survey Report - ${esc(s.siteName || 'Site')} (${esc(s.vesNo || '')})</title>
<style>
  body { font-family: Arial, sans-serif; margin: 30px; color: #1B1E1F; background: #fff; }
  .header { border-bottom: 2px solid #102A3D; padding-bottom: 12px; margin-bottom: 20px; }
  .header h1 { margin: 0; color: #102A3D; font-size: 22px; }
  .header h2 { margin: 4px 0 0; color: #1C6E76; font-size: 14px; font-weight: normal; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
  .box { background: #F6F4EE; padding: 12px; border-radius: 6px; border: 1px solid #D6D0BE; }
  .box strong { color: #102A3D; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
  th, td { border: 1px solid #D6D0BE; padding: 6px 10px; text-align: left; }
  th { background: #102A3D; color: #fff; text-transform: uppercase; font-size: 11px; }
  tr:nth-child(even) { background: #F9F9F9; }
  .print-btn { background: #102A3D; color: #fff; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 20px; }
  @media print { .print-btn { display: none; } }
</style>
</head>
<body>
  <button class="print-btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
  <div class="header">
    <h1>National Water Supply & Drainage Board — Sri Lanka</h1>
    <h2>Vertical Electrical Sounding (VES) Field Survey Report</h2>
  </div>
  <div class="grid">
    <div class="box">
      <p><strong>Site Name:</strong> ${esc(s.siteName || 'N/A')}</p>
      <p><strong>Client Name:</strong> ${esc(s.clientName || 'N/A')}</p>
      <p><strong>VES Station No:</strong> ${esc(s.vesNo || 'N/A')}</p>
      <p><strong>Array Type:</strong> ${esc(s.array || 'Schlumberger')}</p>
    </div>
    <div class="box">
      <p><strong>Date:</strong> ${esc(s.date || 'N/A')}</p>
      <p><strong>Chart ID:</strong> ${esc(s.chartId || 'N/A')}</p>
      <p><strong>Recorded By:</strong> ${esc(s.operator || 'N/A')}</p>
      <p><strong>GPS Location:</strong> ${esc(s.lat || '—')}, ${esc(s.lng || '—')}</p>
    </div>
  </div>

  <h3>Field Measurements & Apparent Resistivity</h3>
  <table>
    <thead>
      <tr>
        <th>AB/2 (m)</th>
        <th>MN/2 (m)</th>
        <th>Geometric Factor (K)</th>
        <th>Resistance (Ω)</th>
        <th>Apparent Resistivity ρa (Ω·m)</th>
      </tr>
    </thead>
    <tbody>
      ${readingsRows || '<tr><td colspan="5">No measurement readings saved for this survey.</td></tr>'}
    </tbody>
  </table>
</body>
</html>`;

    var blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
    var filename = "VES_Report_" + (s.siteName || "Survey").replace(/[^a-z0-9]/gi, '_') + "_" + (s.vesNo || "1") + ".html";
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); }, 300);
  }

  function exportCsv(){
    if (!lastRows.length){ setStatus("Nothing loaded to export yet — click Refresh first.", "err"); return; }
    var lines = ["Chart ID,Site,Client,VES No,Date,Array,Readings Count,Recorded By,Device,Updated"];
    lastRows.forEach(function(r){
      lines.push([
        r.chartId, r.siteName, r.clientName, r.vesNo, r.date, r.array, (r.readings||[]).length, r.operator, r.deviceId,
        r.updatedAt ? new Date(r.updatedAt).toISOString() : ""
      ].map(function(v){ return '"' + String(v==null?"":v).replace(/"/g,'""') + '"'; }).join(","));
    });
    var blob = new Blob([lines.join("\n")], {type:"text/csv"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ves_all_surveys_" + new Date().toISOString().slice(0,10) + ".csv";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); }, 300);
  }

  document.getElementById("connectBtn").addEventListener("click", function(){ persist(); fetchSurveys(); });
  document.getElementById("refreshBtn").addEventListener("click", function(){ persist(); fetchSurveys(); });
  document.getElementById("exportBtn").addEventListener("click", exportCsv);

  loadSaved();
  if (baseUrlEl.value) fetchSurveys();
})();
</script>
</body>
</html>
